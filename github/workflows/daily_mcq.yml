name: Auto Daily Assamese MCQ Factory

on:
  # প্রতিদিনে পুৱা ৬:০০ বজাত (IST) স্বয়ংক্ৰিয়ভাৱে চলিব
  schedule:
    - cron: '30 0 * * *'
  
  # তুমি যেতিয়াই ইচ্ছা ১-ক্লিকত নিজেও চলাব পাৰিবা
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-questions:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Assamese MCQ Generator Robot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 generate_mcq.py

      - name: 4. Save New Questions to Database (questions.json)
        run: |
          git config --local user.email "bot@assamexamhub.in"
          git config --local user.name "Assam Exam Hub Auto-Bot"
          git add questions.json
          git diff --staged --quiet || git commit -m "Auto-added daily Assamese MCQs"
          git push
